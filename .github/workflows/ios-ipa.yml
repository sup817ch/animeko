      run: './gradlew :app:ios:podInstall "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"'
      if: '${{ steps.step-16.outcome == ''failure'' }}'
    - id: 'step-18'
      name: 'Patch ios Plist (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: './gradlew :app:ios:patchInfoPlist "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"'
    - id: 'step-19'
      name: 'Patch ios Plist (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: './gradlew :app:ios:patchInfoPlist "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"'
      if: '${{ steps.step-18.outcome == ''failure'' }}'
    - id: 'step-20'
      name: 'Build iOS Debug IPA (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: './gradlew :app:ios:buildDebugIpa "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"'
    - id: 'step-21'
      name: 'Build iOS Debug IPA (Attempt #2)'
      continue-on-error: false
